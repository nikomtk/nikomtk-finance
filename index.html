<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes finances">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png">
<title>Mes finances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f1a4a;
  --navy-2:#1d2b6b;
  --red:#e2001a;
  --blue:#4a6fd8;
  --teal:#1f9d8a;
  --bg:#f3f4f8;
  --card:#ffffff;
  --line:#e6e8f0;
  --text:#0f1a4a;
  --muted:#6b7394;
  --soft:#eef1fa;
  --pos:#138a5e;
  --neg:#c8102e;
  --shadow:0 1px 2px rgba(15,26,74,.05),0 6px 20px rgba(15,26,74,.06);
  --font:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#dfe5ff; --navy-2:#b9c4f5; --blue:#7f9bf0; --teal:#3cc4ae;
    --bg:#0a0f2c; --card:#141b45; --line:#253066; --text:#eef1fb; --muted:#9aa3c8; --soft:#1c2558;
    --pos:#3fcf93; --neg:#ff5a6e; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --navy:#dfe5ff; --navy-2:#b9c4f5; --blue:#7f9bf0; --teal:#3cc4ae;
  --bg:#0a0f2c; --card:#141b45; --line:#253066; --text:#eef1fb; --muted:#9aa3c8; --soft:#1c2558;
  --pos:#3fcf93; --neg:#ff5a6e; --shadow:none;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;margin:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
#app{max-width:600px;margin:0 auto;height:100%;display:flex;flex-direction:column;}
button{font-family:inherit;}

/* header */
.top{flex:none;display:flex;align-items:center;gap:10px;padding:12px 18px 6px;}
.top img{width:30px;height:30px;border-radius:8px;}
.top .brand{font-weight:700;font-size:15px;flex:1;}
.top .brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--text);height:34px;padding:0 11px;border-radius:17px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;cursor:pointer;}
.ghost svg{width:15px;height:15px;}

main{flex:1;overflow-y:auto;padding:4px 16px 28px;-webkit-overflow-scrolling:touch;}
h1.page{font-size:28px;font-weight:800;letter-spacing:-.6px;margin:8px 2px 14px;}
h2.sec{font-size:16px;font-weight:700;margin:26px 2px 10px;display:flex;align-items:center;justify-content:space-between;}
h2.sec .link{font-size:13px;font-weight:600;color:var(--blue);background:none;border:none;padding:4px 0;cursor:pointer;}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin:6px 2px 0;}

.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat .l{font-size:12px;color:var(--muted);font-weight:500;}
.stat .v{font-size:20px;font-weight:700;margin-top:4px;letter-spacing:-.3px;}
.pos{color:var(--pos);} .neg{color:var(--neg);}

/* hero épargne */
.hero{background:linear-gradient(145deg,#0f1a4a 0%,#1d2f7a 100%);color:#fff;border:none;padding:20px 18px 18px;position:relative;overflow:hidden;}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(226,0,26,.9);opacity:.18;}
.hero .l{font-size:13px;color:#c7cff0;font-weight:500;}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-1px;margin:4px 0 16px;}
.split-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.15);}
.split-bar i{display:block;height:100%;}
.split-legend{display:flex;justify-content:space-between;margin-top:12px;gap:10px;}
.split-legend div{font-size:12px;color:#c7cff0;}
.split-legend b{display:block;color:#fff;font-size:17px;font-weight:700;margin-top:2px;}
.type-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:12px;}
.type-legend div{font-size:12px;color:#c7cff0;display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0;}
.type-legend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.type-legend b{color:#fff;font-weight:700;white-space:nowrap;}
.hero .who{display:flex;justify-content:space-between;align-items:baseline;}
.hero .who .n{font-size:15px;font-weight:700;color:#fff;}
.hero.alt{background:linear-gradient(145deg,#26306b 0%,#3b3f8f 100%);}
.tip{display:block;margin-bottom:10px;}
.tip h3{font-size:15px;font-weight:700;margin:0 0 6px;display:flex;align-items:center;gap:8px;}
.tip p{font-size:13.5px;line-height:1.55;margin:6px 0 0;color:var(--text);}
.tip .muted{color:var(--muted);font-size:12.5px;}
.tip .fig{font-weight:800;}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;}
.badge.ok{background:#e3f5ec;color:#0f7a4f;} .badge.warn{background:#fde7ea;color:#b0102a;} .badge.info{background:var(--soft);color:var(--blue);}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;}

/* listes éditables */
.rows{padding:4px 16px;}
.row{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row .main{flex:1;min-width:0;}
.row .sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
input,select{font-family:inherit;font-size:15px;color:var(--text);background:transparent;border:none;outline:none;padding:6px 0;width:100%;}
input.lbl{font-weight:600;}
.amt{flex:none;width:110px;display:flex;align-items:center;justify-content:flex-end;gap:3px;background:var(--soft);border-radius:10px;padding:0 10px;}
.amt input{text-align:right;font-weight:600;padding:8px 0;}
.amt span{color:var(--muted);font-size:13px;font-weight:600;}
.amt:focus-within{box-shadow:0 0 0 2px var(--blue);}
select.src{font-size:11.5px;color:var(--muted);padding:0;width:auto;-webkit-appearance:none;appearance:none;background:none;}
.del{flex:none;width:28px;height:28px;border-radius:50%;border:none;background:var(--red);color:#fff;font-size:18px;line-height:1;cursor:pointer;}
.add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;padding:12px;border-radius:14px;border:1.5px dashed var(--line);background:transparent;color:var(--blue);font-weight:600;font-size:14px;cursor:pointer;}
.total{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-top:1px solid var(--line);font-weight:700;}
.total span:first-child{color:var(--muted);font-weight:600;font-size:13px;}
.chev{flex:none;width:30px;height:30px;border-radius:50%;border:none;background:var(--soft);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s;}
.chev[aria-expanded="true"]{transform:rotate(180deg);}
.detail{padding:4px 0 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.detail .f{background:var(--soft);border-radius:12px;padding:8px 12px;}
.f label{display:block;font-size:11px;color:var(--muted);font-weight:600;}
.f input,.f select{font-weight:600;padding:3px 0;}
.f.full{grid-column:1/-1;}
.toggle{display:flex;align-items:center;justify-content:space-between;}
.switch{position:relative;width:44px;height:26px;flex:none;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch span{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:.2s;}
.switch span::after{content:"";position:absolute;width:22px;height:22px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s;}
.switch input:checked+span{background:var(--navy-2);}
.switch input:checked+span::after{transform:translateX(18px);}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--soft);color:var(--muted);}
.chip.warn{background:#fde7ea;color:#b0102a;}

/* crédits */
.credit{margin-bottom:12px;}
.credit-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.credit-head input{font-size:17px;font-weight:700;}
.credit-crd{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.credit-crd .v{font-size:22px;font-weight:800;}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.fields .f{background:var(--soft);border-radius:12px;padding:8px 10px;}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible;}
.chart .ax{font-size:10px;fill:var(--muted);font-family:var(--font);}
.chart .grid{stroke:var(--line);stroke-width:1;}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:600;}
.chart-legend b{color:var(--text);font-weight:700;margin-left:4px;}
.chart-hit{fill:transparent;}
.tipline{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;}
.chart-tip{font-size:12px;color:var(--muted);margin-bottom:6px;min-height:18px;}
.chart-tip b{color:var(--text);}

.donut-wrap{display:flex;align-items:center;gap:16px;}
.donut{width:120px;height:120px;flex:none;position:relative;}
.legend{flex:1;font-size:13px;}
.legend div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);}
.legend div:last-child{border-bottom:none;}
.legend span:first-child{color:var(--muted);}

/* projection */
.proj{background:linear-gradient(145deg,#0f1a4a 0%,#1d2f7a 100%);color:#fff;border:none;}
.proj .yrs{font-size:30px;font-weight:800;}
.proj .l{font-size:12.5px;color:#c7cff0;}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:rgba(255,255,255,.2);margin:14px 0 6px;padding:0;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--red);}
.proj .rate{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:#c7cff0;}
.proj .rate input{width:64px;background:rgba(255,255,255,.12);border-radius:8px;text-align:center;color:#fff;font-weight:700;padding:6px;}
.proj .out{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15);}
.proj .fv{font-size:32px;font-weight:800;letter-spacing:-.8px;}
.proj .det{display:flex;justify-content:space-between;font-size:12px;color:#c7cff0;margin-top:6px;gap:8px;}

/* PV */
.pv-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.pv-row:last-child{border-bottom:none;}
.pv-row .n{font-weight:600;}
.pv-row .s{font-size:11.5px;color:var(--muted);margin-top:2px;}
.pv-row .p{text-align:right;font-weight:700;}

/* immo */
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.form .f{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.cmp{border-collapse:separate;border-spacing:0;min-width:660px;width:100%;font-size:13px;}
table.cmp th,table.cmp td{padding:10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);}
table.cmp th{font-size:11.5px;color:var(--muted);font-weight:600;white-space:normal;vertical-align:bottom;}
table.cmp td:first-child,table.cmp th:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600;color:var(--text);}
table.cmp tr:last-child td{border-bottom:none;}
table.cmp td.best{background:var(--soft);font-weight:700;}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);}

/* tab bar */
nav.tabs{flex:none;display:flex;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{flex:1 0 auto;min-width:64px;scroll-snap-align:start;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 4px;font-size:10.5px;font-weight:600;position:relative;cursor:pointer;white-space:nowrap;}
nav.tabs svg{width:22px;height:22px;}
nav.tabs button[aria-current="true"]{color:var(--navy);}
nav.tabs button[aria-current="true"]::before{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:2px;background:var(--red);}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <img src="apple-touch-icon.png" alt="">
    <div class="brand">Mes finances<small data-k="maj"></small></div>
    <button class="ghost" id="btn-export" aria-label="Exporter une sauvegarde"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Sauver</button>
    <button class="ghost" id="btn-import" aria-label="Importer une sauvegarde"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg></button>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
const KEY='mes-finances';
const uid=()=>Math.random().toString(36).slice(2,9);

const TYPES=[['Livret','#6f8ef0'],['Épargne logement','#a9c1ff'],['Assurance-vie','#2fbfa8'],['PEA','#ff3b55'],['CTO','#ff9a62'],['PER','#a58bff'],['Épargne salariale','#f2c94c'],['Compte courant','#c7cff0'],['Autre','#7c86b8']];
const typeColor=t=>(TYPES.find(x=>x[0]===t)||TYPES[TYPES.length-1])[1];
function guessType(l){ l=(l||'').toLowerCase();
  if(/\bper\b|perin|perco|retraite/.test(l)&&!/pei|pee/.test(l)) return /perco/.test(l)?'Épargne salariale':'PER';
  if(/pei|pee|salariale|interessement|intéressement|participation/.test(l)) return 'Épargne salariale';
  if(/\bpel\b|\bcel\b|logement/.test(l)) return 'Épargne logement';
  if(/pea/.test(l)) return 'PEA';
  if(/cto|titre|degiro|trade|bourse/.test(l)) return 'CTO';
  if(/assurance|contrat|\buc\b|euro|vie|capitalisation/.test(l)) return 'Assurance-vie';
  if(/livret|ldds|lep|\bla\b/.test(l)) return 'Livret';
  if(/\bcc\b|courant|tirelire|compte/.test(l)) return 'Compte courant';
  return 'Autre'; }
const SOURCES=['Salaire','Prime / 13e mois','Revenus locatifs','Dividendes & intérêts','Activité indépendante','Allocations','Pension','Autre'];

function defaults(){
  const L=arr=>arr.map(l=>({id:uid(),label:l,montant:0}));
  return {
    version:3, meta:{updated:new Date().toISOString()},
    noms:{moi:'',p1:'Compte 1',p2:'Compte 2'},
    salaire:{brutAnnuel:'',netAvantImpotAnnuel:'',impotAnnuel:''},
    fiscal:{revenuFoyer:'',parts:'',lep:'nsp'},
    revenus:[],
    abonnements:[],
    chargesFixes:L(['Assurance habitation','Eau','Électricité']),
    chargesVariables:L(['Alimentation / courses','Transport / carburant','Restaurants & sorties','Loisirs','Santé','Divers / imprévus']),
    versements:[],
    credits:[],
    comptes:{p1:[],p2:[]},
    historique:[],
    projYears:15, projRendement:null,
    immo:{typeBien:'ancien',prixBien:180000,fraisNotairePct:7.5,travaux:8000,apport:15000,tauxCredit:3.6,dureeAnnees:20,tauxAssurancePct:0.3,loyerMensuel:750,chargesCoproMensuel:60,taxeFonciereAnnuelle:1100,gestionLocativePct:0,vacanceLocativePct:8.3,assurancePNOAnnuelle:150,mobilierValeur:6000,tmiPct:30}
  };
}

/* accepte les sauvegardes de toutes les versions précédentes */
function migrate(s){
  if(!s || typeof s!=='object') return defaults();
  const d=defaults();
  if(!Array.isArray(s.revenus)) s.revenus=[{id:uid(),label:'Salaire net',source:'Salaire',montant:parseFloat(s.salaire)||0}];
  if(typeof s.salaire!=='object'||s.salaire===null) delete s.salaire;
  ['abonnements','chargesFixes','chargesVariables','versements','historique','credits'].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=d[k]; });
  /* anciennes clés de personnes -> p1 / p2 (dans l'ordre) */
  const oldKeys=s.comptes?Object.keys(s.comptes).filter(k=>k!=='p1'&&k!=='p2'):[];
  if(!s.noms){ s.noms={moi:'',p1:'Compte 1',p2:'Compte 2'}; oldKeys.forEach((k,i)=>{ if(i<2) s.noms['p'+(i+1)]=k.charAt(0).toUpperCase()+k.slice(1); }); }
  if(!s.comptes) s.comptes={};
  oldKeys.forEach((k,i)=>{ if(i<2 && !s.comptes['p'+(i+1)]) s.comptes['p'+(i+1)]=s.comptes[k]; delete s.comptes[k]; });
  ['p1','p2'].forEach(p=>{ if(!Array.isArray(s.comptes[p])) s.comptes[p]=[]; s.comptes[p].forEach(c=>{ if(c.investi===undefined) c.investi=''; if(c.bloque===undefined) c.bloque=false; }); });
  s.historique.forEach(h=>{ const ks=Object.keys(h).filter(k=>!['id','date','p1','p2'].includes(k)); ks.forEach((k,i)=>{ if(i<2 && h['p'+(i+1)]===undefined) h['p'+(i+1)]=h[k]; delete h[k]; }); if(h.p1===undefined) h.p1=0; if(h.p2===undefined) h.p2=0; });
  if(Array.isArray(s.memos)){
    s.memos.forEach(m=>{ ['p1','p2'].forEach(p=>{ const c=s.comptes[p].find(x=>x.id===m.compteId); if(c && (c.investi===''||c.investi==null)) c.investi=m.investi; }); });
    delete s.memos;
  }
  s.credits.forEach(c=>{ if(c.capitalRestant===undefined) c.capitalRestant=''; delete c.taux; });
  if(!s.salaire){ const sal=s.revenus.filter(r=>r.source==='Salaire'); const m=sal.reduce((a,r)=>a+(parseFloat(r.montant)||0),0);
    s.salaire={brutAnnuel:'',netAvantImpotAnnuel:m?Math.round(m*12*100)/100:'',impotAnnuel:''}; s.revenus=s.revenus.filter(r=>r.source!=='Salaire'); }
  if(!s.fiscal) s.fiscal={revenuFoyer:'',parts:'',lep:'nsp'};
  ['p1','p2'].forEach(p=>s.comptes[p].forEach(c=>{ if(!c.type) c.type=guessType(c.label); }));
  s.immo=Object.assign({},d.immo,s.immo||{});
  delete s.bourse;
  if(s.projYears==null) s.projYears=15;
  if(!s.meta) s.meta={updated:new Date().toISOString()};
  s.version=3;
  return s;
}
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw){ return migrate(JSON.parse(raw)); } }catch(e){}
  return defaults();
}
let state=load();
function save(){ state.meta.updated=new Date().toISOString(); try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
save();

/* ---------- nombres ---------- */
const num=v=>{ if(v===''||v==null) return 0; if(typeof v==='number') return v; const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isNaN(n)?0:n; };
const toInput=v=>(v===''||v==null)?'':String(v).replace('.',',');
const eur=(n,d)=>(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:d||0,maximumFractionDigits:d||0});
const pct=(n,d)=>(n*100).toLocaleString('fr-FR',{minimumFractionDigits:d==null?1:d,maximumFractionDigits:d==null?1:d})+' %';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const sumOf=arr=>arr.reduce((a,x)=>a+num(x.montant),0);
const getPath=p=>p.split('.').reduce((o,k)=>o[k],state);
function setPath(p,v){ const ks=p.split('.'); const last=ks.pop(); ks.reduce((o,k)=>o[k],state)[last]=v; }

/* ---------- calculs ---------- */
const salNetAvant=()=>num(state.salaire.netAvantImpotAnnuel), salImpot=()=>num(state.salaire.impotAnnuel), salBrut=()=>num(state.salaire.brutAnnuel);
const salaireMensuel=()=>(salNetAvant()-salImpot())/12;
const totRevenus=()=>salaireMensuel()+sumOf(state.revenus);
const totAbos=()=>sumOf(state.abonnements);
const totCharges=()=>sumOf(state.chargesFixes)+sumOf(state.chargesVariables);
const totVersements=()=>sumOf(state.versements);

function moisRestants(dateFin){
  if(!dateFin) return 0;
  const end=new Date(dateFin+'T00:00:00'), now=new Date();
  if(isNaN(end)||end<=now) return 0;
  let m=(end.getFullYear()-now.getFullYear())*12+(end.getMonth()-now.getMonth());
  if(end.getDate()>=now.getDate()) m+=1;
  return Math.max(0,m);
}
const crdSaisi=c=>c.capitalRestant!==''&&c.capitalRestant!=null;
function crd(c){ return moisRestants(c.dateFin)&&crdSaisi(c) ? num(c.capitalRestant) : 0; }
function totalRestant(c){ return num(c.mensualite)*moisRestants(c.dateFin); }
/* taux nominal annuel retrouvé à partir du capital restant dû, de la mensualité et du nombre d'échéances */
function tauxCredit(c){
  const n=moisRestants(c.dateFin), m=num(c.mensualite), K=num(c.capitalRestant);
  if(!n||!m||!crdSaisi(c)||K<=0) return {etat:'vide'};
  if(K>m*n+0.5) return {etat:'incoherent'};
  const pv=r=>r<1e-9? m*n : m*(1-Math.pow(1+r,-n))/r;
  let lo=0, hi=0.05; if(pv(hi)>K) return {etat:'incoherent'};
  for(let i=0;i<80;i++){ const mid=(lo+hi)/2; if(pv(mid)>K) lo=mid; else hi=mid; }
  return {etat:'ok', taux:(lo+hi)/2*12*100};
}
const totMensualites=()=>state.credits.filter(c=>moisRestants(c.dateFin)>0).reduce((a,c)=>a+num(c.mensualite),0);
const totCRD=()=>state.credits.reduce((a,c)=>a+crd(c),0);
const totRestant=()=>state.credits.reduce((a,c)=>a+totalRestant(c),0);
const crdManquants=()=>state.credits.filter(c=>moisRestants(c.dateFin)&&!crdSaisi(c)).length;
const totDepenses=()=>totAbos()+totCharges()+totVersements()+totMensualites();
const reste=()=>totRevenus()-totDepenses();
const tauxEpargne=()=>totRevenus()? totVersements()/totRevenus():0;
const totCompte=p=>sumOf(state.comptes[p]);
const totBloque=p=>state.comptes[p].filter(c=>c.bloque).reduce((a,c)=>a+num(c.montant),0);
const N1=()=>esc(state.noms.p1||'Compte 1'), N2=()=>esc(state.noms.p2||'Compte 2');
const totFoyer=()=>totCompte('p1')+totCompte('p2');
const patrimoine=()=>totCompte('p1')-totCRD();
const parType=p=>{ const o={}; state.comptes[p].forEach(c=>{ const t=c.type||guessType(c.label); o[t]=(o[t]||0)+num(c.montant); }); return TYPES.map(t=>[t[0],o[t[0]]||0,t[1]]).filter(x=>x[1]>0); };

function defaultRendement(){
  const all=[...state.comptes.p1,...state.comptes.p2];
  const tot=sumOf(all); if(!tot) return 4;
  const dyn=all.filter(c=>/pea|degiro|action|\buc\b|bourse|cto|titre/i.test(c.label)).reduce((a,c)=>a+num(c.montant),0);
  return Math.round(((tot-dyn)*0.025+dyn*0.065)/tot*1000)/10;
}
const rendement=()=> (state.projRendement===null||state.projRendement==='') ? defaultRendement() : num(state.projRendement);
function projection(years,rPct,pmt,p0){
  const rm=Math.pow(1+rPct/100,1/12)-1, n=Math.round(years*12);
  return Math.abs(rm)<1e-9 ? p0+pmt*n : p0*Math.pow(1+rm,n)+pmt*((Math.pow(1+rm,n)-1)/rm)*(1+rm);
}

function immo(){
  const im=state.immo;
  const prix=num(im.prixBien), notaire=prix*num(im.fraisNotairePct)/100, travaux=num(im.travaux);
  const cout=prix+notaire+travaux, emprunt=Math.max(0,cout-num(im.apport));
  const r=num(im.tauxCredit)/100/12, n=Math.max(1,num(im.dureeAnnees)*12);
  const mCredit=r? emprunt*r/(1-Math.pow(1+r,-n)) : emprunt/n;
  const mAss=emprunt*num(im.tauxAssurancePct)/100/12, mTot=mCredit+mAss;
  const loyerBrut=num(im.loyerMensuel)*12, loyer=loyerBrut*(1-num(im.vacanceLocativePct)/100);
  const charges=num(im.chargesCoproMensuel)*12+num(im.taxeFonciereAnnuelle)+num(im.assurancePNOAnnuelle)+loyer*num(im.gestionLocativePct)/100;
  const interets=emprunt*num(im.tauxCredit)/100 + mAss*12;
  const tmi=num(im.tmiPct)/100, psF=0.172, psB=0.186;
  const amort=prix*0.85*0.025 + (travaux/10) + num(im.mobilierValeur)/7;
  const amortNu=0;
  function reg(nom,base,type){
    let impot; const ps=(type==='foncier'||type==='std')?psF:psB;
    if(type==='foncier'){ const pos=Math.max(0,base); const def=Math.min(10700,Math.max(0,-base)); impot=pos*(tmi+ps)-def*tmi; }
    else if(type==='is'){ const b=Math.max(0,base); impot=b<=42500? b*0.15 : 42500*0.15+(b-42500)*0.25; }
    else impot=Math.max(0,base)*(tmi+ps);
    impot=Math.round(impot);
    const cf=(loyer-charges-mTot*12-impot)/12;
    return {nom,impot,cf,brut:cout?loyerBrut/cout*100:0,net:cout?(loyer-charges)/cout*100:0,netnet:cout?(loyer-charges-Math.max(0,impot))/cout*100:0};
  }
  const regs=[
    reg('Nue · micro-foncier',loyer*0.7,'std'),
    reg('Nue · réel',loyer-charges-interets-amortNu,'foncier'),
    reg('LMNP · micro-BIC',loyer*0.5,'bic'),
    reg('LMNP · réel',loyer-charges-interets-amort,'bic'),
    reg('SCI à l’IS',loyer-charges-interets-amort,'is')
  ];
  return {cout,emprunt,mTot,loyer,charges,regs};
}

/* ---------- valeurs calculées (mises à jour sans reconstruire les champs) ---------- */
function K(k){
  const [a,b]=k.split(':');
  switch(a){
    case 'maj': return 'mis à jour le '+new Date(state.meta.updated).toLocaleDateString('fr-FR');
    case 'revenus': return eur(totRevenus());
    case 'depenses': return eur(totDepenses());
    case 'reste': return eur(reste());
    case 'taux': return pct(tauxEpargne());
    case 'foyer': return eur(totFoyer());
    case 'nic': return eur(totCompte('p1'));
    case 'ben': return eur(totCompte('p2'));
    case 'nicBloque': return 'dont bloqué '+eur(totBloque('p1'));
    case 'patrimoine': return eur(patrimoine());
    case 'crd': return eur(totCRD())+(crdManquants()?' *':'');
    case 'mens': return eur(totMensualites(),2);
    case 'sum': return eur(sumOf(getPath(b)),2);
    case 'crdOne': { const c=state.credits.find(x=>x.id===b); if(!c) return ''; const t=tauxCredit(c); return t.etat==='ok'? t.taux.toLocaleString('fr-FR',{maximumFractionDigits:2})+' %' : (t.etat==='incoherent'?'incohérent':'—'); }
    case 'restOne': { const c=state.credits.find(x=>x.id===b); return c?eur(totalRestant(c)):''; }
    case 'intOne': { const c=state.credits.find(x=>x.id===b); if(!c) return ''; return crdSaisi(c)&&tauxCredit(c).etat==='ok'? eur(totalRestant(c)-num(c.capitalRestant)) : '—'; }
    case 'restant': return eur(totRestant());
    case 'salMens': return eur(salaireMensuel());
    case 'salTaux': return salNetAvant()? pct(salImpot()/salNetAvant()) : '—';
    case 'salCharges': return salBrut()&&salNetAvant()? pct(1-salNetAvant()/salBrut()) : '—';
    case 'autresRev': return eur(sumOf(state.revenus));
    case 'resteOne': { const c=state.credits.find(x=>x.id===b); if(!c) return ''; const n=moisRestants(c.dateFin); return n? n+' mensualité'+(n>1?'s':'')+' restante'+(n>1?'s':'') : 'terminé'; }
    case 'years': return state.projYears+' an'+(state.projYears>1?'s':'');
  }
  return '';
}
function H(k){
  const [a,b]=k.split(':');
  if(a==='evo'){
    const hist=state.historique.filter(h=>h.date).slice().sort((x,y)=>x.date.localeCompare(y.date));
    if(hist.length<2) return '<p class="hint">Ajoute au moins deux relevés dans l\'onglet Épargne pour voir la courbe.</p>';
    const xs=hist.map(h=>new Date(h.date+'T00:00:00').getTime());
    const nic=hist.map(h=>num(h.p1)), ben=hist.map(h=>num(h.p2));
    const c=chartColors();
    return lineSVG({id:'evo',xs,xLabel:t=>new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}),
      series:[{name:'Total',color:c.navy,data:nic.map((v,i)=>v+ben[i]),w:2.5,fill:true},{name:N1(),color:c.blue,data:nic,w:1.8},{name:N2(),color:c.red,data:ben,w:1.8}]});
  }
  if(a==='projChart'){
    const y=state.projYears, p0=totFoyer(), pmt=totVersements(), r=rendement(), yr=new Date().getFullYear(), c=chartColors();
    const xs=[],V=[],B=[]; for(let i=0;i<=y;i++){ xs.push(yr+i); V.push(projection(i,r,pmt,p0)); B.push(p0+pmt*12*i); }
    return lineSVG({id:'proj',xs,xLabel:t=>String(t),series:[{name:'Avec rendement',color:c.red,data:V,w:2.5,fill:true},{name:'Sans rendement',color:c.muted,data:B,w:1.5,dash:true}]});
  }
  if(a==='donut'){
    const c=chartColors(), vals=[totMensualites(),totVersements(),Math.max(0,totAbos()),totCharges()], tot=vals.reduce((x,y)=>x+y,0)||1;
    const R=46, C=2*Math.PI*R; let off=0;
    const segs=vals.map((v,i)=>{ const len=v/tot*C; const el=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${c.set[i]}" stroke-width="16" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`; off+=len; return el; }).join('');
    return `<svg viewBox="0 0 120 120" width="120" height="120">${segs}<text x="60" y="57" text-anchor="middle" class="ax" style="font-size:9px;fill:${c.muted};font-family:inherit;">dépenses</text><text x="60" y="72" text-anchor="middle" style="font-size:13px;font-weight:800;fill:${c.navy};font-family:inherit;">${eur(tot)}</text></svg>`;
  }
  if(a==='chip'){ const c=state.credits.find(x=>x.id===b); if(!c) return ''; const t=tauxCredit(c); if(!moisRestants(c.dateFin)) return '<span class="chip">terminé</span>'; return t.etat==='vide'?'<span class="chip warn">capital ?</span>':(t.etat==='incoherent'?'<span class="chip warn">à vérifier</span>':''); }
  if(a==='creditMsg'){ const c=state.credits.find(x=>x.id===b); if(!c) return ''; const t=tauxCredit(c);
    return t.etat==='incoherent'?`<p class="hint" style="color:var(--neg);margin-top:8px;">Le capital restant dû dépasse la somme des mensualités restantes (${eur(totalRestant(c))}) : c'est impossible. Vérifie la date de dernière échéance et que la mensualité est bien celle hors assurance.</p>`:''; }
  if(a==='person'){ const tot=totCompte(b), types=parType(b), t=tot||1;
    return `<div class="who"><span class="n">${b==='p1'?N1():N2()}</span><span class="l">${b==='p1'?'dont bloqué '+eur(totBloque('p1')):''}</span></div>
      <div class="big" style="margin:4px 0 14px;">${eur(tot)}</div>
      <div class="split-bar">${types.map(x=>`<i style="width:${x[1]/t*100}%;background:${x[2]}"></i>`).join('')}</div>
      <div class="type-legend">${types.map(x=>`<div><span><i class="dot" style="background:${x[2]}"></i>${x[0]}</span><b>${eur(x[1])} · ${Math.round(x[1]/t*100)} %</b></div>`).join('')||'<div><span>Aucun compte</span></div>'}</div>`; }
  if(a==='conseilsBody') return conseilsBody();
  if(a==='split'){
    const n=totCompte('p1'), bj=totCompte('p2'), t=n+bj||1;
    return `<i style="width:${n/t*100}%;background:#ffffff"></i><i style="width:${bj/t*100}%;background:#e2001a"></i>`;
  }
  if(a==='repart'){
    const items=[['Crédits',totMensualites()],['Versements épargne',totVersements()],['Abonnements',totAbos()],['Charges & dépenses',totCharges()]];
    const cols=chartColors();
    return items.map((x,i)=>`<div><span><i class="dot" style="background:${cols.set[i]}"></i>${x[0]}</span><b>${eur(x[1])}</b></div>`).join('');
  }
  if(a==='pv'){
    const list=[...state.comptes.p1.map(c=>[c,N1()]),...state.comptes.p2.map(c=>[c,N2()])].filter(([c])=>c.investi!==''&&c.investi!=null);
    if(!list.length) return '<p class="hint" style="margin:6px 0;">Aucun compte suivi. Ouvre un compte ci-dessus (flèche) et renseigne son montant initialement investi.</p>';
    return list.map(([c,o])=>{ const inv=num(c.investi), val=num(c.montant), pv=val-inv, pr=inv?pv/inv:0;
      return `<div class="pv-row"><div><div class="n">${esc(c.label)}</div><div class="s">${o} · investi ${eur(inv)} → valeur ${eur(val)}</div></div>
      <div class="p ${pv>=0?'pos':'neg'}">${pv>=0?'+':''}${eur(pv)}<div class="s" style="text-align:right;">${pv>=0?'+':''}${pct(pr)}</div></div></div>`; }).join('');
  }
  if(a==='proj'){
    const y=state.projYears, p0=totFoyer(), pmt=totVersements(), fv=projection(y,rendement(),pmt,p0), vers=pmt*12*y;
    return `<div class="l">en ${new Date().getFullYear()+y}, en continuant à verser ${eur(pmt)}/mois</div>
      <div class="fv">${eur(fv)}</div>
      <div class="det"><span>versements futurs ${eur(vers)}</span><span>intérêts & plus-values ${eur(fv-p0-vers)}</span></div>`;
  }
  if(a==='immoRes'){
    const r=immo(); const best=Math.max(...r.regs.map(x=>x.cf));
    return `<div class="grid2">
      <div class="card stat"><div class="l">Montant emprunté</div><div class="v">${eur(r.emprunt)}</div></div>
      <div class="card stat"><div class="l">Mensualité + assurance</div><div class="v">${eur(r.mTot)}</div></div>
    </div>
    <p class="hint">Coût total de l'opération ${eur(r.cout)} · loyers encaissés estimés ${eur(r.loyer)}/an · charges ${eur(r.charges)}/an</p>
    <h2 class="sec">Comparatif des régimes (1re année)</h2>
    <div class="card" style="padding:4px 0;"><div class="tbl-scroll"><table class="cmp">
      <thead><tr><th></th>${r.regs.map(x=>`<th>${x.nom}</th>`).join('')}</tr></thead>
      <tbody>
        <tr><td>Cash-flow / mois</td>${r.regs.map(x=>`<td class="${x.cf===best?'best ':''}${x.cf>=0?'pos':'neg'}">${x.cf>=0?'+':''}${eur(x.cf)}</td>`).join('')}</tr>
        <tr><td>Impôt / an</td>${r.regs.map(x=>`<td>${x.impot<0?'−'+eur(-x.impot)+' *':eur(x.impot)}</td>`).join('')}</tr>
        <tr><td>Rendement brut</td>${r.regs.map(x=>`<td>${x.brut.toFixed(1).replace('.',',')} %</td>`).join('')}</tr>
        <tr><td>Rendement net</td>${r.regs.map(x=>`<td>${x.net.toFixed(1).replace('.',',')} %</td>`).join('')}</tr>
        <tr><td>Net après impôt</td>${r.regs.map(x=>`<td>${x.netnet.toFixed(1).replace('.',',')} %</td>`).join('')}</tr>
      </tbody></table></div></div>
    <p class="hint">Ton reste à vivre actuel : ${eur(reste())}/mois — c'est ce qui absorberait un cash-flow négatif.</p>`;
  }
  return '';
}
function refresh(){
  document.querySelectorAll('[data-k]').forEach(el=>{ el.textContent=K(el.dataset.k); });
  document.querySelectorAll('[data-h]').forEach(el=>{ el.innerHTML=H(el.dataset.h); });
  document.querySelectorAll('[data-sign]').forEach(el=>{ const v=({reste:reste(),patrimoine:patrimoine()})[el.dataset.sign]; el.classList.toggle('neg',v<0); });
  scheduleCharts();
}

function pRevenus(){
  return `<h1 class="page">Revenus</h1>
  <div class="card stat"><div class="l">Total des revenus mensuels</div><div class="v" style="font-size:28px;" data-k="revenus"></div></div>

function conseilsBody(){
  const tmi=tmiRetenue(), tmiSrc=tmiEstimee()===null?'reprise de l\'onglet Immo — renseigne revenu et parts pour l\'affiner':'estimée avec le barème 2026';
  const perMens=state.versements.filter(v=>/\bper\b/i.test(v.label)).reduce((a,v)=>a+num(v.montant),0), perAn=perMens*12;
  const revPro=salNetAvant()*0.9, plafond=Math.max(4710,Math.min(37680,revPro*0.1)), marge=Math.max(0,plafond-perAn);
  const depMens=totAbos()+totCharges()+totMensualites();
  const dispo=state.comptes.p1.filter(c=>!c.bloque&&['Livret','Compte courant'].includes(c.type||guessType(c.label))).reduce((a,c)=>a+num(c.montant),0);
  const mois=depMens? dispo/depMens : 0;
  const types=Object.fromEntries(parType('p1').map(x=>[x[0],x[1]]));
  const la=state.comptes.p1.find(c=>/livret a/i.test(c.label)), ldds=state.comptes.p1.find(c=>/ldds/i.test(c.label));
  const credits=state.credits.map(c=>[c,tauxCredit(c)]).filter(x=>x[1].etat==='ok');
  const te=tauxEpargne();
  const tip=(titre,badge,corps)=>`<div class="card tip"><h3>${titre} ${badge||''}</h3>${corps}</div>`;
  const B=(t,c)=>`<span class="badge ${c}">${t}</span>`;
  const P=t=>`<p>${t}</p>`;
  let h='<h2 class="sec">Défiscalisation</h2>';
  h+=tip('Ta tranche marginale',B(Math.round(tmi*100)+' %','info'),
    P(`TMI ${tmiSrc}. Chaque euro déduit de ton revenu imposable te fait économiser <b>${Math.round(tmi*100)} centimes</b> d'impôt.`)+
    (salNetAvant()?P(`Ton taux moyen d'imposition sur salaire est de <b>${salImpot()&&salNetAvant()?pct(salImpot()/salNetAvant()):'—'}</b>.`):P('<span class="muted">Renseigne ton salaire dans l\'onglet Revenus pour des conseils chiffrés.</span>')));

    (salNetAvant()?P(`Plafond de déduction estimé pour tes versements 2026 : <b>${eur(plafond)}</b> (10 % de tes revenus d'activité 2025, entre 4 710 € et 37 680 €). ${marge>0?`Il te reste environ <b>${eur(marge)}</b> de marge : les verser avant le 31 décembre ferait économiser jusqu'à <b class="fig">${eur(marge*tmi)}</b>.`:'Tu es au plafond.'}`):'')+
    P('<span class="muted">Depuis 2026, les plafonds non utilisés se reportent sur 5 ans (au lieu de 3) : ton montant exact figure sur ton avis d\'impôt, rubrique « plafond épargne retraite ». L\'argent reste bloqué jusqu\'à la retraite (sauf achat de la résidence principale) et les gains subissent 18,6 % de prélèvements sociaux à la sortie. À TMI 11 % ou moins, l\'intérêt est faible.</span>'));

    P('<b>Emploi à domicile</b> (ménage, jardinage, soutien scolaire…) : 50 % des dépenses en crédit d\'impôt, jusqu\'à 12 000 € de dépenses par an (majorations possibles).')+
    P('<b>Frais réels</b> : si tes trajets domicile-travail sont longs, compare avec l\'abattement forfaitaire de 10 %.')+

      (mois>9?P(`Au-delà de 6 mois, l'excédent (environ <b>${eur(dispo-6*depMens)}</b>) dort à 1,7 %, sous l'inflation (autour de 2 %). Il travaillerait mieux sur un PEA ou une assurance-vie.`):'')
    :P('<span class="muted">Renseigne tes dépenses pour calculer ce point.</span>'));
  h+=tip('Livrets réglementés','',

  h+=tip('Taux d\'épargne', te>=0.2?B('excellent','ok'):(te>=0.1?B('correct','info'):B('faible','warn')),

  if(credits.length){
    h+='<h2 class="sec">Crédits</h2>';
    h+=tip('Rembourser par anticipation ?','',credits.map(([c,t])=>P(`<b>${esc(c.label)}</b> — taux estimé ${t.taux.toLocaleString('fr-FR',{maximumFractionDigits:2})} % : ${t.taux<1.7?'plus bas que le Livret A, <b>ne rembourse pas</b> par anticipation, ton épargne rapporte plus.':(t.taux<3.5?'comparable à ce que rapporte une épargne prudente : pas de priorité à rembourser.':'<b>coûteux</b> : un remboursement anticipé partiel peut valoir le coup (vérifie les pénalités, souvent plafonnées à 3 % du capital remboursé ou 6 mois d\'intérêts).')}`)).join(''));
  }

  h+='<h2 class="sec">Immobilier locatif</h2>';
  h+=tip('Ce qui a changé en 2026','',
    P('<b>LMNP (meublé)</b> : l\'amortissement au réel est maintenu, mais les prélèvements sociaux passent à 18,6 % et, depuis le 15 février 2025, les amortissements déduits sont réintégrés dans la plus-value à la revente.')+
    P('<b>Dispositif Jeanbrun</b> (location nue, achats du 21/02/2026 au 31/12/2028) : amortissement de 3 à 5,5 % par an sur 80 % du prix, plafonné à 8 000–12 000 € par an selon le niveau de loyer, avec loyers plafonnés ; dans l\'ancien, travaux d\'au moins 30 % du prix.')+
    P('<b>Déficit foncier</b> : jusqu\'à 10 700 € par an imputables sur ton revenu global en location nue avec travaux.')+
    P('<span class="muted">Compare ces régimes sur un bien précis dans l\'onglet Immo.</span>'));
  h+=`<div class="note">Infos à jour au 27 septembre 2026 (loi de finances et LFSS 2026, taux des livrets au 1er août 2026). Ce sont des pistes générales calculées à partir de tes saisies, pas un conseil fiscal personnalisé : fais valider les montants importants par un conseiller. Pour actualiser ces conseils, demande une mise à jour de l'appli à Claude.</div>`;
  return h;
}

/* ---------- graphiques (SVG maison, sans bibliothèque) ---------- */
function chartColors(){
  const cs=getComputedStyle(document.documentElement);
  const g=(n,f)=>(cs.getPropertyValue(n)||'').trim()||f;
  return {navy:g('--navy','#0f1a4a'),red:'#e2001a',blue:g('--blue','#4a6fd8'),teal:g('--teal','#1f9d8a'),muted:g('--muted','#6b7394'),line:g('--line','#e6e8f0'),card:g('--card','#fff'),
    set:[g('--navy','#0f1a4a'),g('--teal','#1f9d8a'),'#e2001a',g('--blue','#4a6fd8')]};
}
const chartStore={};
function niceTicks(min,max,count){
  if(min===max){ min-=1; max+=1; }
  const span=max-min, step0=span/count, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(x=>x>=step0)||10*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
  for(let v=lo;v<=hi+step/2;v+=step) t.push(v);
  return t;
}
function kfmt(v){ return Math.abs(v)>=1000 ? (v/1000).toLocaleString('fr-FR',{maximumFractionDigits:Math.abs(v)>=100000?0:1})+' k' : Math.round(v).toLocaleString('fr-FR'); }
function lineSVG(o){
  const W=340,H=190,L=40,R=10,T=10,B=24;
  const all=o.series.flatMap(s=>s.data);
  let mn=Math.min(...all), mx=Math.max(...all); const pad=(mx-mn)*0.08||mx*0.05||1; mn-=pad; mx+=pad;
  const ticks=niceTicks(mn,mx,4); const y0=ticks[0], y1=ticks[ticks.length-1];
  const x0=o.xs[0], x1=o.xs[o.xs.length-1]||x0+1;
  const X=t=>L+(x1===x0?0:(t-x0)/(x1-x0))*(W-L-R), Y=v=>T+(1-(v-y0)/(y1-y0||1))*(H-T-B);
  let g=ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="ax" x="${L-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${kfmt(v)}</text>`).join('');
  const idx=[0,Math.floor((o.xs.length-1)/2),o.xs.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  g+=idx.map((i,k)=>`<text class="ax" x="${X(o.xs[i]).toFixed(1)}" y="${H-6}" text-anchor="${k===0?'start':(i===o.xs.length-1?'end':'middle')}">${o.xLabel(o.xs[i])}</text>`).join('');
  const paths=o.series.map((s,si)=>{
    const pts=s.data.map((v,i)=>[X(o.xs[i]),Y(v)]);
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const area=s.fill?`<path d="${d} L${pts[pts.length-1][0].toFixed(1)} ${Y(y0).toFixed(1)} L${pts[0][0].toFixed(1)} ${Y(y0).toFixed(1)} Z" fill="${s.color}" opacity=".08"/>`:'';
    const last=pts[pts.length-1];
    return area+`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`+(s.dash?'':`<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${s.color}"/>`);
  }).join('');
  chartStore[o.id]={o,X,L,R,W,H,T,B};
  const lastI=o.xs.length-1;
  return `<div class="chart-tip" id="tip-${o.id}">${tipText(o,lastI)}</div>
  <svg viewBox="0 0 ${W} ${H}" data-chart="${o.id}">${g}${paths}<line class="tipline" id="tl-${o.id}" x1="0" x2="0" y1="${T}" y2="${H-B}" style="display:none"/><rect class="chart-hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/></svg>
  <div class="chart-legend">${o.series.map(s=>`<span><i class="dot" style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`;
}
function tipText(o,i){ return `<b>${o.xLabel(o.xs[i])}</b> · `+o.series.map(s=>`${s.name} <b>${eur(s.data[i])}</b>`).join(' · '); }
function chartPointer(e){
  const svg=e.target.closest('svg[data-chart]'); if(!svg) return;
  const st=chartStore[svg.dataset.chart]; if(!st) return;
  const rect=svg.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX);
  const x=(cx-rect.left)/rect.width*st.W;
  let best=0,bd=1e9; st.o.xs.forEach((t,i)=>{ const d=Math.abs(st.X(t)-x); if(d<bd){bd=d;best=i;} });
  const tl=document.getElementById('tl-'+svg.dataset.chart), tip=document.getElementById('tip-'+svg.dataset.chart);
  const px=st.X(st.o.xs[best]); if(tl){ tl.setAttribute('x1',px); tl.setAttribute('x2',px); tl.style.display=''; }
  if(tip) tip.innerHTML=tipText(st.o,best);
}
document.addEventListener('pointerdown',chartPointer);
document.addEventListener('pointermove',e=>{ if(e.buttons||e.pointerType==='touch') chartPointer(e); });
function scheduleCharts(){}

/* ---------- événements ---------- */
function parseVal(el){
  const t=el.dataset.type;
  if(t==='bool') return el.checked;
  if(t==='int') return parseInt(el.value,10)||1;
  if(t==='num') return num(el.value);
  if(t==='numOrEmpty') return el.value.trim()===''? (el.dataset.list?'':null) : num(el.value);
  return el.value;
}
function applyInput(el){
  const v=parseVal(el);
  if(el.dataset.bind){ setPath(el.dataset.bind,v); }
  else if(el.dataset.list){ const it=getPath(el.dataset.list).find(x=>x.id===el.dataset.id); if(!it) return false; it[el.dataset.field]=(el.dataset.field==='taux'&&v==='')?null:v; }
  else return false;
  save(); return true;
}
view.addEventListener('input',e=>{ const el=e.target; if(el.type==='checkbox'||el.tagName==='SELECT') return; if(applyInput(el)) refresh(); });
view.addEventListener('change',e=>{
  const el=e.target;
  if(el.type==='checkbox'||el.tagName==='SELECT'){
    if(!applyInput(el)) return;
    if(el.dataset.bind==='immo.typeBien'){ state.immo.fraisNotairePct=el.value==='neuf'?2.5:7.5; save(); }
    render(true); return;
  }
});
document.addEventListener('click',e=>{
  const tab=e.target.closest('nav.tabs button'); if(tab){ ui.tab=tab.dataset.tab; render(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, path=b.dataset.path;
  if(act==='edit'){ ui.edit[path]=!ui.edit[path]; render(true); }
  else if(act==='open'){ ui.open[b.dataset.id]=!ui.open[b.dataset.id]; render(true); }
  else if(act==='del'){ const arr=getPath(path); const i=arr.findIndex(x=>x.id===b.dataset.id); if(i>-1) arr.splice(i,1); save(); render(true); }
  else if(act==='add'){
    const arr=getPath(path); let it;
    if(path==='credits') it={id:uid(),label:'Nouveau crédit',mensualite:0,capitalRestant:'',dateFin:new Date(new Date().getFullYear()+5,0,1).toISOString().slice(0,10)};
    else if(path.startsWith('comptes.')) it={id:uid(),label:'Nouveau compte',montant:0,bloque:false,investi:'',type:'Livret'};
    else if(path==='revenus') it={id:uid(),label:'Nouveau revenu',source:'Autre',montant:0};
    else it={id:uid(),label:'Nouvelle ligne',montant:0};
    arr.push(it); save(); render(true);
    const inp=view.querySelector(`input[data-id="${it.id}"][data-field="label"]`); if(inp){ inp.focus(); inp.select(); }
  }
  else if(act==='snapshot'){ state.historique.push({id:uid(),date:new Date().toISOString().slice(0,10),p1:Math.round(totCompte('p1')*100)/100,p2:Math.round(totCompte('p2')*100)/100}); save(); render(true); }
});

/* ---------- sauvegarde / import ---------- */
document.getElementById('btn-export').addEventListener('click',async()=>{
  const json=JSON.stringify(state,null,2), filename='mes-finances-'+new Date().toISOString().slice(0,10)+'.json';
  try{ const file=new File([json],filename,{type:'application/json'}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Sauvegarde Mes finances'}); return; } }catch(err){ if(err&&err.name==='AbortError') return; }
  try{ const dl=await window.claude?.use?.('downloads'); if(dl){ await dl.save({filename,data:new Blob([json],{type:'application/json'})}); return; } }
  catch(err){ if(err&&(err.code==='declined'||err.code==='rate_limited')) return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); }
  catch(e){ alert('Sauvegarde impossible dans cette vue.'); }
});
document.getElementById('btn-import').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ state=migrate(JSON.parse(await f.text())); save(); render(); }
  catch(err){ alert("Ce fichier n'est pas une sauvegarde Mes finances valide."); }
  e.target.value='';
});

render();
